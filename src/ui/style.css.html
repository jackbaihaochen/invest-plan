<style>
:root {
  --bg: #0f1216;
  --card: #171c23;
  --card-2: #1e252e;
  --line: #2a323d;
  --fg: #e8edf3;
  --muted: #93a1b3;
  --accent: #4ade80;
  --accent-dim: #16321f;
  --warn: #fbbf24;
  --danger: #f87171;
  --plan: #60a5fa;
  --radius: 14px;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP",
               "PingFang SC", "Microsoft YaHei", sans-serif;
  font-feature-settings: "tnum";
  -webkit-font-smoothing: antialiased;
}
main { max-width: 1080px; margin: 0 auto; padding: 20px 16px 60px; }

.topbar { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; gap: 12px; }
h1 { font-size: 20px; margin: 0; letter-spacing: .02em; }
h2 { font-size: 14px; margin: 0 0 14px; color: var(--muted); font-weight: 600; letter-spacing: .04em; }
h3 { font-size: 13px; margin: 0 0 10px; color: var(--muted); font-weight: 600; }
.sub { margin: 4px 0 0; font-size: 12px; color: var(--muted); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-bottom: 14px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.row-between { display: flex; justify-content: space-between; align-items: center; }
.small { font-size: 12px; color: var(--muted); margin-top: 8px; }
.note { font-size: 11.5px; color: var(--muted); line-height: 1.6; margin: 12px 0 0; }
.tag { font-size: 10px; background: var(--card-2); color: var(--warn); padding: 2px 7px; border-radius: 20px; margin-left: 6px; vertical-align: middle; }

/* hero */
.hero { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
.ring-wrap { position: relative; width: 168px; height: 168px; flex-shrink: 0; }
.ring { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-bg, .ring-fg { fill: none; stroke-width: 13; }
.ring-bg { stroke: var(--card-2); }
.ring-fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 1s cubic-bezier(.2,.7,.3,1); }
.ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring-pct { font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
.ring-label { font-size: 11px; color: var(--muted); margin-top: 2px; }
.hero-figures { display: flex; gap: 32px; flex-wrap: wrap; flex: 1; }
.figure { display: flex; flex-direction: column; gap: 4px; }
.figure .k { font-size: 11.5px; color: var(--muted); }
.figure .v { font-size: 24px; font-weight: 700; letter-spacing: -.02em; }
.figure .v.dim { color: var(--muted); font-weight: 600; }
.delta { font-size: 11.5px; }
.up { color: var(--accent); } .down { color: var(--danger); }

/* verdict */
.verdict { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 20px; }
.verdict-main { display: flex; flex-direction: column; gap: 6px; }
.verdict-main .k { font-size: 11.5px; color: var(--muted); }
.verdict-main .k em { color: var(--fg); font-style: normal; font-weight: 600; }
.eta { font-size: 22px; font-weight: 700; color: var(--warn); }
.eta.plan { color: var(--plan); }
.verdict-gap { text-align: center; padding: 12px 18px; border-radius: 12px; background: var(--card-2); border: 1px solid var(--line); }
.gap-label { display: block; font-size: 10.5px; color: var(--muted); margin-bottom: 4px; }
.gap-value { font-size: 20px; font-weight: 700; }
.verdict.behind .gap-value { color: var(--danger); }
.verdict.ahead .gap-value, .verdict.on_track .gap-value { color: var(--accent); }

/* bars */
.bar { height: 10px; background: var(--card-2); border-radius: 6px; overflow: hidden; margin: 6px 0; }
.bar-fill { height: 100%; background: var(--accent); border-radius: 6px; transition: width .8s cubic-bezier(.2,.7,.3,1); }
.bar-fill.short { background: var(--warn); }
.warn { color: var(--warn); }
.streak { font-size: 12px; color: var(--muted); }

/* breakdown */
.breakdown { display: flex; flex-direction: column; gap: 12px; }
.bd-row { display: flex; flex-direction: column; gap: 5px; }
.bd-head { display: flex; justify-content: space-between; font-size: 12.5px; }
.bd-bar { height: 6px; border-radius: 4px; background: var(--card-2); overflow: hidden; }
.bd-bar span { display: block; height: 100%; border-radius: 4px; }
.stale { margin-top: 14px; font-size: 11.5px; color: var(--warn); line-height: 1.6; }

/* milestones */
.milestones { display: flex; gap: 10px; flex-wrap: wrap; }
.ms { flex: 1; min-width: 92px; text-align: center; padding: 14px 8px; border-radius: 12px; background: var(--card-2); border: 1px solid var(--line); }
.ms.done { background: var(--accent-dim); border-color: var(--accent); }
.ms .amt { display: block; font-size: 14px; font-weight: 700; }
.ms .st { display: block; font-size: 10.5px; color: var(--muted); margin-top: 4px; }
.ms.done .st { color: var(--accent); }

/* forecast */
.slider-row { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; flex-wrap: wrap; }
.slider-row label { font-size: 12px; color: var(--muted); white-space: nowrap; }
.slider-row input[type=range] { flex: 1; min-width: 180px; accent-color: var(--accent); }
.slider-row output { font-size: 15px; font-weight: 700; min-width: 96px; text-align: right; }
.whatif-result { font-size: 13px; margin-bottom: 16px; padding: 12px 14px; background: var(--card-2); border-radius: 10px; line-height: 1.7; }
.whatif-result strong { color: var(--accent); }

/* caveats */
.caveats ul { margin: 0; padding-left: 18px; }
.caveats li { font-size: 12.5px; color: var(--muted); line-height: 1.85; margin-bottom: 6px; }
.caveats li strong { color: var(--fg); }

/* forms */
.forms { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form { display: flex; flex-direction: column; gap: 8px; padding: 14px; background: var(--card-2); border-radius: 12px; }
.form.wide { grid-column: 1 / -1; }
input, select, textarea, button {
  font: inherit; font-size: 13px; padding: 9px 11px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg);
}
textarea { resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
button { background: var(--accent); color: #06240f; font-weight: 700; border: none; cursor: pointer; }
button:hover { filter: brightness(1.08); }
button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 500; }
button.ghost:hover { color: var(--fg); }
button:disabled { opacity: .5; cursor: default; }

/* misc */
.loading { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 70vh; gap: 16px; color: var(--muted); font-size: 13px; }
.spinner { width: 26px; height: 26px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.error { margin: 24px; padding: 16px; border-radius: 12px; background: #2a1414; border: 1px solid var(--danger); color: #fca5a5; font-size: 13px; line-height: 1.7; }
.footer { text-align: center; font-size: 11px; color: var(--muted); line-height: 1.8; margin-top: 28px; }

@media (max-width: 760px) {
  .grid2, .forms { grid-template-columns: 1fr; }
  .verdict { grid-template-columns: 1fr; text-align: left; }
  .verdict-gap { text-align: left; }
  .hero { gap: 20px; }
  .hero-figures { gap: 20px; }
  .figure .v { font-size: 20px; }
}
</style>
